name: Build PDF

on:
  workflow_call:
    inputs:
      relative_path:
        description: "Relative path to the LaTeX project folder"
        required: true
        type: string
      tex_name:
        description: "LaTeX file name"
        required: false
        type: string
        default: "main"
      out_name:
        description: "Compiled PDF's name"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v6

      - name: Download custom template
        run: |
          curl -OL https://github.com/MarcosLopezM/HomeworkTemplate/archive/refs/heads/main.zip
          unzip main.zip
          mv HomeworkTemplate-main/ hw-template/
          rm *.zip
          ls -lh

      - name: Build PDF with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ inputs.relative_path }}/${{ inputs.tex_name }}.tex
          work_in_root_file_dir: true
          texlive_version: latest
          extra_fonts: |
            ../hw-template/fonts/linux-libertine/*.otf
            ../hw-template/fonts/linux-biolinum/*.otf
          latexmk_shell_escape: true
          latexmk_use_lualatex: true
        env:
          TEXINPUTS: ".:/hw-template//:"
        

      - name: Create output folder
        run: |
          mkdir -p build/${{ inputs.relative_path }}
          mv ${{ inputs.relative_path }}/${{ inputs.tex_name }}.pdf build/${{ inputs.relative_path }}/${{  inputs.out_name }}.pdf

      - name: Ensure PDF was generated
        run: test -f build/${{ inputs.relative_path }}/${{ inputs.out_name }}.pdf
        
      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.out_name }}
          path: build/${{ inputs.relative_path }}/${{ inputs.out_name }}.pdf

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          clean: false
          branch: gh-pages
          git-config-name: github-actions
          git-config-email: github-actions@github.com
          token: ${{ secrets.GITHUB_TOKEN }}
